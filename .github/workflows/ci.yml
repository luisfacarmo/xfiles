name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: cd app && composer install --no-progress --prefer-dist

      - name: PHPStan
        run: cd app && vendor/bin/phpstan analyse --level 5

  js:
    name: JS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install --legacy-peer-deps

      - name: Lint
        run: cd app && npx eslint src/ 2>/dev/null || true

      - name: Build
        run: cd app && npm run build
        env:
          NODE_ENV: production
